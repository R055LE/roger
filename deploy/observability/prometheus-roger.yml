# Prometheus scrape job for Roger's /metrics endpoint (backlog 3.1).
#
# Merge this job into your Prometheus config. Compose publishes the endpoint on host loopback port
# 9108 by default. If Prometheus runs elsewhere, set METRICS_BIND_ADDRESS to a trusted private host
# interface and replace the target below. The endpoint has no authentication or TLS; never bind it
# to an untrusted network. The public repo carries no real hostnames.
scrape_configs:
  - job_name: roger
    scrape_interval: 30s
    static_configs:
      - targets: ["localhost:9108"] # Docker host; match METRICS_HOST_PORT if overridden
        labels:
          app: roger
